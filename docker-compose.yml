services:
  ms-personal:
    build: ./ms-personal
    ports:
      - "8083:8083"
    healthcheck:
      # /api/entrenadores ahora requiere JWT; se usa /v3/api-docs (público,
      # expuesto por springdoc) solo para confirmar que la app arrancó.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  ms-membresias:
    build: ./ms-membresias
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  ms-inventario:
    build: ./ms-inventario
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  ms-programacion:
    build: ./ms-programacion
    ports:
      - "8082:8082"
    environment:
      # Dentro de la red de docker-compose, ms-personal se resuelve por el
      # nombre del servicio en vez de localhost.
      PERSONAL_SERVICE_URL: http://ms-personal:8083
    depends_on:
      ms-personal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Keycloak Authentication Server
  # - Provee OAuth2/OpenID Connect (emisión y validación de JWT)
  # - No usa base de datos persistente: cada vez que el contenedor se
  #   recrea (docker compose down / up) arranca desde cero e importa el
  #   realm "gimnasio" a partir del export real generado con
  #   `kc.sh export` (keycloak/full-export/), que incluye los secrets
  #   reales de cada cliente y los usuarios de prueba con sus
  #   credenciales. Así el realm queda versionado en el repositorio en
  #   lugar de vivir en un volumen, y cualquier cambio manual hecho en
  #   la consola de administración se pierde al recrear el contenedor.
  # - Accesible en el puerto 8080
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: keycloak_gym_app
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/full-export/gimnasio-realm.json:/opt/keycloak/data/import/gimnasio-realm.json:ro
      - ./keycloak/full-export/gimnasio-users-0.json:/opt/keycloak/data/import/gimnasio-users-0.json:ro
