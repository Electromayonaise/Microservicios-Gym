services:
  ms-personal:
    build: ./ms-personal
    ports:
      - "8083:8083"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # /api/entrenadores ahora requiere JWT; se usa /v3/api-docs (público,
      # expuesto por springdoc) solo para confirmar que la app arrancó.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  ms-membresias:
    build: ./ms-membresias
    ports:
      - "8081:8081"
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  ms-inventario:
    build: ./ms-inventario
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8084/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  ms-programacion:
    build: ./ms-programacion
    ports:
      - "8082:8082"
    environment:
      # Dentro de la red de docker-compose, ms-personal se resuelve por el
      # nombre del servicio en vez de localhost.
      PERSONAL_SERVICE_URL: http://ms-personal:8083
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      ms-personal:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/v3/api-docs"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Keycloak Authentication Server
  # - Provee OAuth2/OpenID Connect (emisión y validación de JWT)
  # - No usa base de datos persistente: cada vez que el contenedor se
  #   recrea (docker compose down / up) arranca desde cero e importa el
  #   realm "gimnasio" a partir del export real generado con
  #   `kc.sh export` (keycloak/full-export/), que incluye los secrets
  #   reales de cada cliente y los usuarios de prueba con sus
  #   credenciales. Así el realm queda versionado en el repositorio en
  #   lugar de vivir en un volumen, y cualquier cambio manual hecho en
  #   la consola de administración se pierde al recrear el contenedor.
  # - Accesible en el puerto 8080
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: keycloak_gym_app
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/full-export/gimnasio-realm.json:/opt/keycloak/data/import/gimnasio-realm.json:ro
      - ./keycloak/full-export/gimnasio-users-0.json:/opt/keycloak/data/import/gimnasio-users-0.json:ro

  # RabbitMQ - broker de mensajeria para las notificaciones asincronas de
  # inscripcion, el patron publish/subscribe de cambios de horario y la
  # Dead Letter Queue de pagos fallidos (ver
  # docs/superpowers/specs/2026-09-14-rabbitmq-integracion-design.md). La
  # imagen "-management" trae el plugin de consola/API de gestion en el
  # puerto 15672, usado tambien desde la coleccion de Postman para
  # verificar que los mensajes efectivamente pasaron por cada cola.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq_gym_app
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Kafka - streaming de eventos para el reporte de ocupacion de clases en
  # tiempo real y el analisis de datos de entrenamiento de miembros (ver
  # docs/superpowers/specs/2026-09-15-kafka-integracion-design.md). Modo
  # KRaft (sin Zookeeper), un solo broker, con dos listeners: uno interno
  # (kafka:9092) usado por los microservicios y kafka-ui dentro de la red
  # de Docker, y uno externo (localhost:9092, publicado desde el puerto de
  # contenedor 9093) para cuando los microservicios corren fuera de Docker
  # via Maven (Opcion 2 del README).
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka_gym_app
    ports:
      - "9092:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://kafka:9094,PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9094'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  # Kafka UI (Provectus) - consola web para inspeccionar topics, particiones,
  # mensajes y el offset commiteado de cada consumer group. Tambien usada
  # desde la coleccion de Postman (carpeta "3. Kafka") via su REST API para
  # verificar que cada flujo efectivamente avanzo el offset esperado.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka_ui_gym_app
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
